<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
    <link rel="manifest" href="/site.webmanifest">
    <title>Scrumpoke</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <!-- Welcome -->
    <main id="welcome-view" class="welcome-main">
      <div class="welcome-inner">
        <div class="welcome-logo-wrap">
          <img src="/logo.png" alt="Scrumpoke logo" class="welcome-logo" />
        </div>

        <h1 class="welcome-title">Scrumpoke</h1>

        <div class="welcome-panel">
          <label class="field-label">
            <div class="field-label-text">Your name</div>
            <input
              id="name-input"
              class="input-text"
              type="text"
              autocomplete="nickname"
              inputmode="text"
            />
          </label>

          <label class="field-label">
            <div class="field-label-text">Room name (optional)</div>
            <input
              id="room-input"
              class="input-text"
              type="text"
              autocomplete="off"
              inputmode="text"
              placeholder="e.g. happy-bunny"
            />
            <div class="field-hint">
              We suggest a random room; clear the field to get another when you join.
            </div>
          </label>

          <button id="join-button" class="btn-primary" type="button">
            <span id="join-button-icon" aria-hidden="true"></span>
            <span>Join</span>
          </button>

          <div id="join-error" class="join-error hidden"></div>
        </div>
      </div>
    </main>

    <!-- Room -->
    <main id="room-view" class="room-main hidden">
      <div class="room-layout">
        <div class="room-game-area">
          <div class="room-grid">
            <!-- Left column -->
            <section>
              <div class="room-controls-row">
                <div class="room-controls-cards">
                  <label class="field-label">
                    <span class="field-label-text">Available cards (comma-separated)</span>
                    <input
                      id="cards-edit-input"
                      class="input-text"
                      type="text"
                    />
                  </label>
                  <button id="cards-edit-button" class="btn-secondary" type="button">
                    Update cards
                  </button>
                </div>
              </div>

              <div class="seat-circle-wrap">
                <div id="seat-circle" class="seat-circle">
                  <div class="seat-circle-center">
                    <button id="reveal-button" class="btn-reveal" type="button">
                      Reveal cards
                    </button>
                  </div>
                </div>
              </div>
            </section>

            <!-- Right column -->
            <aside>
              <div class="participants-panel">
                <div class="participants-header">
                  <span>Participants</span>
                  <span id="participants-count" class="participants-count"></span>
                </div>
                <div id="players-list" class="players-list"></div>
              </div>

              <div id="room-error" class="room-error hidden"></div>
            </aside>
          </div>
        </div>

        <div id="cards-dock" class="cards-dock">
          <div class="cards-dock-inner">
            <div id="cards-list" class="cards-list"></div>
          </div>
        </div>
      </div>
    </main>

    <script src="/app.js" defer></script>
  </body>
</html>
